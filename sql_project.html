<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QueryBench — Daily SQL Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
<style>
  :root{
    --bg:#0F141B; --surface:#161D26; --surface-alt:#1E2733;
    --border:#2A3542; --border-soft:#212B36;
    --amber:#F2B84B; --amber-dim:#8A6A2E;
    --teal:#5FCBBB; --purple:#B48CE0; --danger:#F2685C;
    --text:#E7ECF2; --text-muted:#8B97A6; --text-faint:#5C6773;
    --mono:'IBM Plex Mono',monospace; --display:'Space Grotesk',sans-serif; --body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--body);height:100%;}
  body{display:flex;flex-direction:column;min-height:100vh;}
  ::selection{background:var(--amber);color:#1a1206;}

  /* Loading overlay */
  #loading-overlay{
    position:fixed;inset:0;background:var(--bg);z-index:999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  }
  #loading-overlay .spin{
    width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--amber);
    border-radius:50%;animation:spin .8s linear infinite;
  }
  #loading-overlay p{font-family:var(--mono);color:var(--text-muted);font-size:13px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;border-bottom:1px solid var(--border-soft);
    background:linear-gradient(180deg,#131922,#0F141B);flex-wrap:wrap;gap:10px;
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand-mark{font-family:var(--mono);font-size:13px;color:var(--amber);border:1px solid var(--amber-dim);border-radius:4px;padding:2px 7px;letter-spacing:.06em;}
  .brand-name{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;}
  .top-right{display:flex;align-items:center;gap:16px;}
  .streak-pill{
    font-family:var(--mono);font-size:12.5px;color:var(--text);display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 12px;cursor:pointer;
  }
  .streak-pill:hover{border-color:var(--amber);}
  .progress-pill{font-family:var(--mono);font-size:12.5px;color:var(--text-muted);display:flex;align-items:center;gap:8px;}
  .progress-track{width:110px;height:5px;border-radius:3px;background:var(--surface-alt);overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--teal));border-radius:3px;transition:width .4s ease;}

  .layout{display:flex;flex:1;min-height:0;}
  .sidebar{width:300px;flex-shrink:0;border-right:1px solid var(--border-soft);overflow-y:auto;padding:14px 12px 40px;background:#121821;}

  .filter-label{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;margin:4px 2px 6px;}
  .filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .filter-chip{font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid var(--border);color:var(--text-muted);cursor:pointer;user-select:none;}
  .filter-chip:hover{border-color:var(--text-muted);color:var(--text);}
  .filter-chip.active{background:var(--surface-alt);border-color:var(--amber);color:var(--amber);}

  .tier-group{margin-bottom:2px;}
  .tier-head{display:flex;align-items:center;justify-content:space-between;padding:9px 8px;cursor:pointer;border-radius:6px;user-select:none;}
  .tier-head:hover{background:var(--surface-alt);}
  .tier-title{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.01em;display:flex;align-items:center;gap:7px;}
  .tier-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .tier-count{font-family:var(--mono);font-size:11px;color:var(--text-faint);}
  .tier-caret{font-size:10px;color:var(--text-faint);transition:transform .2s ease;}
  .tier-group.open .tier-caret{transform:rotate(90deg);}
  .exercise-list{display:none;flex-direction:column;padding:2px 0 10px 6px;}
  .tier-group.open .exercise-list{display:flex;}
  .exercise-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--text-muted);border-left:2px solid transparent;}
  .exercise-item:hover{background:var(--surface-alt);color:var(--text);}
  .exercise-item.active{background:var(--surface-alt);color:var(--text);border-left-color:var(--amber);}
  .ex-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ds-tag{font-family:var(--mono);font-size:9px;color:var(--text-faint);border:1px solid var(--border);border-radius:3px;padding:1px 4px;flex-shrink:0;}
  .check{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px;}
  .exercise-item.done .check{background:var(--teal);border-color:var(--teal);color:#0b1a17;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto;}
  .main-inner{max-width:940px;width:100%;margin:0 auto;padding:26px 32px 60px;}

  .welcome h1{font-family:var(--display);font-size:29px;margin:0 0 8px;letter-spacing:-.01em;}
  .welcome p{color:var(--text-muted);line-height:1.6;max-width:640px;}
  .daily-card{
    margin:22px 0;padding:18px 20px;border-radius:10px;
    background:linear-gradient(135deg,rgba(242,184,75,.08),rgba(95,203,187,.05));
    border:1px solid var(--amber-dim);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .daily-card .dc-label{font-family:var(--mono);font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
  .daily-card .dc-title{font-family:var(--display);font-size:18px;font-weight:600;}
  .daily-card .dc-btn{font-family:var(--mono);font-size:12.5px;background:var(--amber);color:#241a06;border:none;border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:600;white-space:nowrap;}

  .schema-svg{width:100%;margin:18px 0 6px;}
  .schema-note{font-family:var(--mono);font-size:12px;color:var(--text-faint);margin-bottom:20px;}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--text-muted);margin-bottom:8px;}
  .legend span{display:flex;align-items:center;gap:6px;}
  .legend .dot{width:8px;height:8px;border-radius:50%;}

  /* Progress panel */
  .progress-panel{background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:20px;margin-top:20px;}
  .pp-stats{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:18px;}
  .pp-stat .num{font-family:var(--display);font-size:24px;font-weight:700;color:var(--amber);}
  .pp-stat .lbl{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;}
  .cal-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;overflow-x:auto;padding-bottom:6px;}
  .cal-cell{width:11px;height:11px;border-radius:2px;background:var(--surface-alt);}
  .cal-cell[data-lvl="1"]{background:#3a5a54;}
  .cal-cell[data-lvl="2"]{background:#4d9187;}
  .cal-cell[data-lvl="3"]{background:var(--teal);}
  .cal-note{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:8px;}

  .crumb{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .tier-badge{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:20px;border:1px solid;}
  .ex-title{font-family:var(--display);font-size:23px;font-weight:600;margin:0 0 12px;letter-spacing:-.01em;}
  .prompt{background:var(--surface);border:1px solid var(--border-soft);border-left:3px solid var(--amber);border-radius:8px;padding:16px 18px;line-height:1.6;font-size:14.5px;margin-bottom:18px;}

  details.schema-ref{margin-bottom:20px;}
  details.schema-ref summary{cursor:pointer;font-family:var(--mono);font-size:12.5px;color:var(--text-muted);padding:8px 0;user-select:none;}
  details.schema-ref summary:hover{color:var(--text);}
  .schema-tables{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;}
  .schema-table{background:var(--surface);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;min-width:150px;font-family:var(--mono);font-size:12px;}
  .schema-table .tname{color:var(--amber);font-weight:600;margin-bottom:6px;}
  .schema-table .col{color:var(--text-muted);}

  .editor-wrap{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#0C1117;}
  .editor-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border-soft);}
  .editor-bar .dots{display:flex;gap:6px;}
  .dots span{width:9px;height:9px;border-radius:50%;background:var(--border);}
  .run-btn{font-family:var(--mono);font-size:12.5px;background:var(--amber);color:#241a06;border:none;border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:6px;}
  .run-btn:hover{filter:brightness(1.08);}
  .run-btn:active{transform:translateY(1px);}
  textarea#sql-input{width:100%;min-height:120px;background:transparent;color:var(--text);border:none;outline:none;resize:vertical;font-family:var(--mono);font-size:14px;line-height:1.55;padding:14px 16px;}
  .hint-row{display:flex;gap:10px;margin-top:12px;}
  .ghost-btn{font-family:var(--mono);font-size:12px;background:transparent;color:var(--text-muted);border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;}
  .ghost-btn:hover{border-color:var(--text-muted);color:var(--text);}
  .reveal-box{margin-top:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--border-soft);border-radius:8px;font-family:var(--mono);font-size:13px;color:var(--text-muted);display:none;}
  .reveal-box.show{display:block;}
  .reveal-box .explain{font-family:var(--body);color:var(--text-muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--border-soft);line-height:1.5;}

  .feedback{margin-top:16px;padding:12px 16px;border-radius:8px;font-size:13.5px;display:none;font-family:var(--body);align-items:center;gap:8px;}
  .feedback.show{display:flex;}
  .feedback.ok{background:rgba(95,203,187,.1);border:1px solid rgba(95,203,187,.35);color:var(--teal);}
  .feedback.bad{background:rgba(242,104,92,.1);border:1px solid rgba(242,104,92,.35);color:var(--danger);}

  .results-wrap{margin-top:18px;}
  .results-label{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
  .table-scroll{overflow:auto;border:1px solid var(--border-soft);border-radius:8px;max-height:320px;}
  table.results{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px;}
  table.results th{position:sticky;top:0;background:var(--surface-alt);color:var(--amber);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
  table.results td{padding:7px 12px;border-bottom:1px solid var(--border-soft);color:var(--text-muted);white-space:nowrap;}
  table.results tr:last-child td{border-bottom:none;}
  .empty-note{color:var(--text-faint);font-family:var(--mono);font-size:12.5px;padding:14px;}

  .nav-footer{display:flex;justify-content:space-between;margin-top:28px;padding-top:16px;border-top:1px solid var(--border-soft);}
  .nav-btn{font-family:var(--mono);font-size:12.5px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:9px 14px;cursor:pointer;}
  .nav-btn:hover{border-color:var(--text-muted);}
  .nav-btn:disabled{opacity:.35;cursor:default;}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width:760px){
    .layout{flex-direction:column;}
    .sidebar{width:100%;max-height:280px;border-right:none;border-bottom:1px solid var(--border-soft);}
    .main-inner{padding:20px 16px 50px;}
  }
</style>
</head>

/* ============================================================

  {id:'retail-1', dataset:'retail', tier:'Fundamentals', title:'Select specific columns',

const STORAGE_KEY = 'sql-practice-progress-v2';

function hasClaudeStorage(){ return typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function'; }
function hasLocalStorage(){
  try{ const t='__qb_test__'; window.localStorage.setItem(t,'1'); window.localStorage.removeItem(t); return true; }catch(e){ return false; }
}

async function loadProgress(){
  try{
    let raw = null;
    if(hasClaudeStorage()){
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value) raw = res.value;
    }else if(hasLocalStorage()){
      raw = window.localStorage.getItem(STORAGE_KEY);
    }
    if(raw){
      const data = JSON.parse(raw);
      completed = new Set(data.completed || []);
      solvedAt = data.solvedAt || {};
    }
  }catch(e){ /* fresh start */ }
}
async function saveProgress(){
  const payload = JSON.stringify({ completed:[...completed], solvedAt });
  try{
    if(hasClaudeStorage()){
      await window.storage.set(STORAGE_KEY, payload, false);
    }else if(hasLocalStorage()){
      window.localStorage.setItem(STORAGE_KEY, payload);
    }
  }catch(e){ console.error('progress save failed', e); }
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dateSeed(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function pickDailyExercise(){
  const idx = dateSeed(todayStr()) % EXERCISES.length;
  return EXERCISES[idx];
}
function practiceDaysFromSolvedAt(){
  const days = new Set();
  Object.values(solvedAt).forEach(ts => days.add(ts.slice(0,10)));
  return days;
}
function computeStreak(){
  const days = practiceDaysFromSolvedAt();
  const today = todayStr();
  let cursor = new Date();
  // if nothing solved today, streak can still count up through yesterday
  if(!days.has(today)) cursor.setDate(cursor.getDate()-1);
  let streak = 0;
  while(true){
    const ds = cursor.getFullYear()+'-'+String(cursor.getMonth()+1).padStart(2,'0')+'-'+String(cursor.getDate()).padStart(2,'0');
    if(days.has(ds)){ streak++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }
  return streak;
}

function renderSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';

  const dsLabel = document.createElement('div');
  dsLabel.className = 'filter-label';
  dsLabel.textContent = 'Dataset';
  sb.appendChild(dsLabel);

  const filterRow = document.createElement('div');
  filterRow.className = 'filter-row';
  ['All', ...Object.keys(DATASETS)].forEach(key=>{
    const label = key==='All' ? 'All' : DATASETS[key].label;
    const chip = document.createElement('div');
    chip.className = 'filter-chip' + (datasetFilter===key ? ' active' : '');
    chip.textContent = label;
    chip.onclick = ()=>{ datasetFilter = key; renderSidebar(); };
    filterRow.appendChild(chip);
  });
  sb.appendChild(filterRow);

  TIERS.forEach(tier=>{
    const inTier = EXERCISES.filter(e=>e.tier===tier.id && (datasetFilter==='All' || e.dataset===datasetFilter));
    if(inTier.length===0) return;
    const doneCount = inTier.filter(e=>completed.has(e.id)).length;

    const group = document.createElement('div');
    group.className = 'tier-group' + (openTiers.has(tier.id) ? ' open' : '');

    const head = document.createElement('div');
    head.className = 'tier-head';
    head.innerHTML = `
      <span class="tier-title"><span class="tier-dot" style="background:${tier.color}"></span>${tier.id}</span>
      <span style="display:flex;align-items:center;gap:8px;">
        <span class="tier-count">${doneCount}/${inTier.length}</span>
        <span class="tier-caret">▶</span>
      </span>`;
    head.onclick = ()=>{ openTiers.has(tier.id) ? openTiers.delete(tier.id) : openTiers.add(tier.id); renderSidebar(); };
    group.appendChild(head);

    const list = document.createElement('div');
    list.className = 'exercise-list';
    inTier.forEach(ex=>{
      const item = document.createElement('div');
      item.className = 'exercise-item' + (ex.id===currentId ? ' active' : '') + (completed.has(ex.id) ? ' done' : '');
      item.innerHTML = `<span class="check">${completed.has(ex.id)?'✓':''}</span><span class="ex-name">${ex.title}</span><span class="ds-tag">${DATASETS[ex.dataset].label}</span>`;
      item.onclick = ()=> selectExercise(ex.id);
      list.appendChild(item);
    });
    group.appendChild(list);
    sb.appendChild(group);
  });
}

function calendarHTML(){
  const days = practiceDaysFromSolvedAt();
  const countsByDay = {};
  Object.values(solvedAt).forEach(ts=>{
    const d = ts.slice(0,10);
    countsByDay[d] = (countsByDay[d]||0)+1;
  });
  const cells = [];
  const today = new Date();
  for(let i=69;i>=0;i--){
    const d = new Date(today);
    d.setDate(d.getDate()-i);
    const ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const c = countsByDay[ds] || 0;
    const lvl = c===0 ? 0 : c===1 ? 1 : c<=3 ? 2 : 3;
    cells.push(`<div class="cal-cell" data-lvl="${lvl}" title="${ds}: ${c} solved"></div>`);
  }
  return `<div class="cal-grid">${cells.join('')}</div><div class="cal-note">Last 70 days · darker = more solved that day</div>`;
}

function tableBox(x,y,name,cols){
  const h = 24 + cols.length*16;
  const rows = cols.map((c,i)=>`<text x="${x+10}" y="${y+42+i*16}" font-family="IBM Plex Mono" font-size="10.5" fill="#8B97A6">${c}</text>`).join('');
  return `<rect x="${x}" y="${y}" width="180" height="${h}" rx="7" fill="#161D26" stroke="#2A3542"/><rect x="${x}" y="${y}" width="180" height="24" rx="7" fill="#1E2733"/><text x="${x+10}" y="${y+16}" font-family="Space Grotesk" font-weight="600" font-size="12.5" fill="#F2B84B">${name}</text>${rows}`;
}

function schemaRefHTML(datasetKey){
  const ds = DATASETS[datasetKey];
  return `<details class="schema-ref"><summary>▸ Show table reference (${ds.label})</summary>
    <div class="schema-tables">
      ${ds.tables.map(t=>`<div class="schema-table"><div class="tname">${t.name}</div>${t.cols.map(c=>`<div class="col">${c}</div>`).join('')}</div>`).join('')}
    </div>
  </details>`;
}

function tierColor(tierId){ return (TIERS.find(t=>t.id===tierId)||{}).color || 'var(--text-muted)'; }

function selectExercise(id){
  currentId = id;
  const ex = EXERCISES.find(e=>e.id===id);
  renderSidebar();
  const main = document.getElementById('main-inner');
  const idx = EXERCISES.findIndex(e=>e.id===id);
  const prev = EXERCISES[idx-1];
  const next = EXERCISES[idx+1];

  main.innerHTML = `
    <div class="crumb">
      <span>${DATASETS[ex.dataset].label} · Exercise ${idx+1} / ${EXERCISES.length}</span>
      <span class="tier-badge" style="color:${tierColor(ex.tier)};border-color:${tierColor(ex.tier)}">${ex.tier}</span>
    </div>
    <h2 class="ex-title">${ex.title}</h2>
    <div class="prompt">${ex.prompt}</div>
    ${schemaRefHTML(ex.dataset)}
    <div class="editor-wrap">
      <div class="editor-bar">
        <div class="dots"><span></span><span></span><span></span></div>
        <button class="run-btn" id="run-btn">▶ Run query <span style="opacity:.6;font-weight:400;">(⌘/Ctrl + Enter)</span></button>
      </div>
      <textarea id="sql-input" spellcheck="false" placeholder="SELECT * FROM ...;"></textarea>
    </div>
    <div class="hint-row">
      <button class="ghost-btn" id="hint-btn">Show hint</button>
      <button class="ghost-btn" id="sol-btn">Show solution</button>
    </div>
    <div class="reveal-box" id="hint-box"></div>
    <div class="reveal-box" id="sol-box"></div>
    <div class="feedback" id="feedback"></div>
    <div class="results-wrap">
      <div class="results-label">Result</div>
      <div class="table-scroll" id="results"><div class="empty-note">Run a query to see results here.</div></div>
    </div>
    <div class="nav-footer">
      <button class="nav-btn" id="prev-btn" ${prev?'':'disabled'}>← ${prev? prev.title : 'Start'}</button>
      <button class="nav-btn" id="next-btn" ${next?'':'disabled'}>${next? next.title : 'Last exercise'} →</button>
    </div>
  `;

  document.getElementById('run-btn').onclick = ()=> runCurrentQuery(ex);
  document.getElementById('hint-btn').onclick = ()=>{
    const box = document.getElementById('hint-box');
    box.textContent = ex.hint;
    box.classList.toggle('show');
  };
  document.getElementById('sol-btn').onclick = ()=>{
    const box = document.getElementById('sol-box');
    box.innerHTML = escapeHtml(ex.ref + ';') + `<div class="explain">${ex.explain}</div>`;
    box.classList.toggle('show');
  };
  const ta = document.getElementById('sql-input');
  ta.addEventListener('keydown', (e)=>{
    if((e.metaKey||e.ctrlKey) && e.key==='Enter'){ e.preventDefault(); runCurrentQuery(ex); }
  });
  if(prev) document.getElementById('prev-btn').onclick = ()=> selectExercise(prev.id);
  if(next) document.getElementById('next-btn').onclick = ()=> selectExercise(next.id);
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function normalizeRows(cols, values){
  return values.map(row => row.map(v=> v===null||v===undefined ? 'NULL' : String(v).trim()).sort().join('␟'));
}

function execToObjects(res){
  if(!res || res.length===0) return {cols:[], rows:[]};
  return { cols: res[0].columns, rows: res[0].values };
}

function runCurrentQuery(ex){
  const ta = document.getElementById('sql-input');
  const feedback = document.getElementById('feedback');
  const resultsDiv = document.getElementById('results');
  const query = ta.value.trim();
  if(!query || !db) return;

  let userRes;
  try{
    userRes = db.exec(query);
  }catch(err){
    feedback.className = 'feedback show bad';
    feedback.innerHTML = `✕ Query error: ${escapeHtml(err.message || String(err))}`;
    resultsDiv.innerHTML = `<div class="empty-note">No results — fix the error above and run again.</div>`;
    return;
  }

  const { cols:userCols, rows:userRows } = execToObjects(userRes);
  renderResultsTable(userCols, userRows, resultsDiv);

  let refRes;
  try{ refRes = db.exec(ex.ref); }catch(err){ refRes = []; }
  const { rows:refRows } = execToObjects(refRes);

  let isCorrect;
  if(ex.orderMatters){
    const a = normalizeRows(userCols, userRows);
    const b = normalizeRows([], refRows);
    isCorrect = a.length===b.length && a.every((v,i)=>v===b[i]);
  }else{
    const a = normalizeRows(userCols, userRows).sort();
    const b = normalizeRows([], refRows).sort();
    isCorrect = a.length===b.length && a.every((v,i)=>v===b[i]);
  }

  if(isCorrect && userRows.length>0){
    feedback.className = 'feedback show ok';
    feedback.innerHTML = `✓ Correct — that matches the expected result (${userRows.length} row${userRows.length===1?'':'s'}).`;
    if(!completed.has(ex.id)){
      completed.add(ex.id);
      solvedAt[ex.id] = new Date().toISOString();
      saveProgress();
      updateHeader();
      renderSidebar();
    }
  }else{
    feedback.className = 'feedback show bad';
    feedback.innerHTML = `✕ Not quite — your result doesn't match yet. Check the hint if you're stuck.`;
  }
}

function renderResultsTable(cols, rows, container){
  if(!rows || rows.length===0){
    container.innerHTML = `<div class="empty-note">Query ran successfully — 0 rows returned.</div>`;
    return;
  }
  let html = '<table class="results"><thead><tr>' + cols.map(c=>`<th>${escapeHtml(c)}</th>`).join('') + '</tr></thead><tbody>';
  rows.slice(0,200).forEach(r=>{
    html += '<tr>' + r.map(v=> `<td>${v===null||v===undefined?'∅':escapeHtml(String(v))}</td>`).join('') + '</tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  await loadProgress();
  dailyExercise = pickDailyExercise();

  const SQL = await initSqlJs({ locateFile: file => `https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/${file}` });
  db = new SQL.Database();
  db.run(SCHEMA_SQL);
  db.run(SEED_SQL);

  document.getElementById('loading-overlay').style.display = 'none';
  updateHeader();
  renderWelcome();
}
init();
</script>
